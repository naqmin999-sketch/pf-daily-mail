name: PF Daily Market Intelligence

# GitHub Actions cron은 UTC 기준. 정각(:00)은 GitHub 서버 혼잡으로 1~2시간씩 밀려서
# (실제로 KST 10시쯤 발송됐음) 혼잡이 덜한 :37분으로 설정.
on:
  schedule:
    - cron: '37 22 * * *'   # 매일 UTC 22:37 = KST 07:37 → 보통 8시 전후 도착
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (send: 전체 파이프라인 / test: 메일 발송 없이 수집·리포트만 / diagnose: 연결 진단만)'
        required: false
        default: 'send'
        type: choice
        options:
          - send
          - test
          - diagnose

permissions:
  contents: write   # ← 추가: 자동수집된 CSV를 레포에 커밋하기 위해 필요
  actions: write    # ← 추가: 60일 무활동 시 스케줄 자동정지 방지(keepalive)

jobs:
  daily-report:
    runs-on: ubuntu-24.04   # ubuntu-latest가 26으로 바뀌는 중 — 폰트/Playwright 호환 위해 고정
    timeout-minutes: 30

    env:
      ECOS_API_KEY:        ${{ secrets.ECOS_API_KEY }}
      NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}   # (선택) 있으면 Claude로 정밀 추출, 없으면 규칙 기반
      EMAIL_SENDER:        ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD:      ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECIPIENTS:    ${{ secrets.EMAIL_RECIPIENTS }}
      EMAIL_SMTP_HOST:     ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT:     ${{ secrets.EMAIL_SMTP_PORT }}
      REPORT_TITLE:        "PF Daily Market Intelligence"
      TIMEZONE:            "Asia/Seoul"
      TZ:                  "Asia/Seoul"   # ← 추가: 서버(UTC) 대신 한국 날짜로 리포트/메일 제목 생성

    steps:
      # ← 추가: 커밋이 60일 없으면 GitHub이 스케줄을 끔(9/28에 실제로 꺼졌음). 매 실행마다 다시 켜둠.
      - name: 스케줄 자동정지 방지 (keepalive)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-report.yml/enable"

      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.12 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 한국어 폰트 설치 (PDF 한글 렌더링)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright Chromium 설치
        run: playwright install --with-deps chromium

      - name: 리포트 생성 및 이메일 발송
        run: |
          if [ "${{ github.event.inputs.mode }}" = "diagnose" ]; then
            python main.py --diagnose
          elif [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python main.py --no-send
          else
            python main.py
          fi

      # ← 추가: 자동수집으로 갱신된 CSV를 레포에 반영 (다음 실행에서 중복 방지의 기준이 됨)
      - name: 자동수집 CSV 커밋
        if: github.event.inputs.mode != 'diagnose'
        run: |
          git config user.name  "pf-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manual_data/deal_watch.csv manual_data/credit_ratings.csv manual_data/cofix.csv
          git add manual_data/deal_history.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: 딜/신용등급/COFIX 자동수집 $(date +%Y-%m-%d)"
          git push
